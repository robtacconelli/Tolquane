[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tolquane"
dynamic = ["version"]
description = "Parallel programming with composable building blocks: nodes, pipelines, farms and all-to-all, on threads, processes or a network."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Roberto Tacconelli" }]
keywords = ["parallel", "streaming", "pipeline", "farm", "dataflow", "fastflow", "building-blocks"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Distributed Computing",
  "Typing :: Typed",
]
dependencies = []

[project.scripts]
tolquane = "tolquane.cli:main"

[project.optional-dependencies]
ai = ["anthropic>=1.0", "openai>=2.0"]
processes = ["cloudpickle>=3.0"]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
msgpack = ["msgpack>=1.0"]
numpy = ["numpy>=1.26"]
cloudpickle = ["cloudpickle>=3.0"]
dev = [
  "pytest>=8.3",
  "pytest-timeout>=2.3",
  "ruff>=0.6",
  "mypy>=1.11",
  "anthropic>=1.0",
  "openai>=2.0",
  "cloudpickle>=3.0",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "tzdata; platform_system == 'Windows'",
]

[project.urls]
Homepage = "https://github.com/robtacconelli/Tolquane"
Repository = "https://github.com/robtacconelli/Tolquane"
Issues = "https://github.com/robtacconelli/Tolquane/issues"
Design = "https://github.com/robtacconelli/Tolquane/blob/main/DESIGN.md"
Changelog = "https://github.com/robtacconelli/Tolquane/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/tolquane/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tolquane"]
# The built GUI is gitignored; list it as an artifact so it still ships.
artifacts = ["src/tolquane/web/static/**"]

[tool.hatch.build.targets.sdist]
include = [
  "src/tolquane",
  "tests",
  "web",
  "hatch_build.py",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]
exclude = ["web/node_modules", "web/dist", "web/test-results", "web/playwright-report", "web/e2e/screenshots"]
artifacts = ["src/tolquane/web/static/**"]

# Builds the frontend with npm when the assets are missing and node is available.
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# examples/generated holds unedited model output; it is tested, not linted.
extend-exclude = ["*.md", "examples/generated"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PT"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["RUF012"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tolquane"]
mypy_path = "src"
warn_unreachable = true

[[tool.mypy.overrides]]
module = "cloudpickle"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
timeout = 30
